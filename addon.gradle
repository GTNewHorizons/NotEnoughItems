compileJava {
    options.encoding = "UTF-8"
}

generateGrammarSource {
    maxHeapSize = "128m"
    arguments += ['-package', 'codechicken.nei.search', '-visitor', '-no-listener']
    outputDirectory = file("${projectDir}/build/generated/sources/search/antlr/codechicken/nei/search/")
}

compileJava.dependsOn generateGrammarSource
sourcesJar.dependsOn generateGrammarSource

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets {
    main {
        java.srcDirs += ["build/generated/sources/search/antlr/"]
    }
}

// ASMReader initializes process-wide remapping caches from the harness's fake Forge environment.
// Keep that setup out of the JVM running the ordinary unit tests.
def mouseKeybindAsmTest = tasks.register('mouseKeybindAsmTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = tasks.named('test', Test).flatMap { it.javaLauncher }
    useJUnitPlatform()
    include '**/MouseKeybindDispatchTest.class'
}

test {
    dependsOn mouseKeybindAsmTest
    exclude '**/MouseKeybindDispatchTest.class'
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
